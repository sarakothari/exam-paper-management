{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Decrypted Question Paper</h3>
            </div>
            <div class="card-body">
                <h4>{{ paper.title }}</h4>
                <div class="mb-3">
                    <label class="form-label">Paper Content:</label>
                    <div class="border p-3 bg-light">
                        {{ content | safe }}
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button onclick="window.print()" class="btn btn-primary">Print Paper</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
