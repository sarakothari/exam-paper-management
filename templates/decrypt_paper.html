{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Decrypt Question Paper</h3>
            </div>
            <div class="card-body">
                <h4>{{ paper.title }}</h4>
                <div class="mb-3">
                    <p>File: {{ paper.file_path.split('/')[-1] }}</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="key" class="form-label">Decryption Key</label>
                        <input type="password" class="form-control" id="key" name="key" required>
                        <div class="form-text">Enter the decryption key provided by the moderator.</div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Decrypt and Download Paper</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
